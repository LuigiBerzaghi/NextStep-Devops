spring.application.name=nextstep
# Spring Boot já reconhece automaticamente:
# SPRING_DATASOURCE_URL
# SPRING_DATASOURCE_USERNAME
# SPRING_DATASOURCE_PASSWORD

#Configurações do DataSource
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

#Confihurações JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# Configurações de upload de arquivos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

logging.level.com.softcode.nextstep=INFO

#Configurações do HikariCP
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=300000

#Configurações do Gemini API (valor vem de variáveis de ambiente/Library)
gemini.api-key=
gemini.model=gemini-2.5-flash
gemini.temperature=0.7
gemini.max-output-tokens=2048

# Configurações do RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Configurações de Messaging
messaging.notifications.exchange=notifications.exchange
messaging.notifications.queue=notifications.queue
messaging.notifications.routing-key=notifications.routing
messaging.notifications.enabled=false
